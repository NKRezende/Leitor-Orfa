<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-glass="on"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leitor de ORFA | NSF</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Exo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--hf:'Exo 2','Archivo',system-ui,sans-serif;--bf:'Archivo',system-ui,'Segoe UI',sans-serif;--ok:#93C90F;--warn:#FF9800;--pb:#2656ED}
[data-theme=dark]{color-scheme:dark;--b0:#070D24;--b1:#0D1A47;--t:#EAF0FF;--m:#9DABD0;--g:rgba(20,34,84,.46);--gs:#142254;--gb:rgba(255,255,255,.14);--hl:rgba(255,255,255,.2);--sh:rgba(2,6,24,.5);--p:#7A9BFF;--row:rgba(255,255,255,.08);--th:rgba(255,255,255,.07);--wbg:rgba(255,152,0,.14);--wt:#FFD08A;--blob1:rgba(38,86,237,.5);--blob2:rgba(147,201,15,.13);--blob3:rgba(48,127,226,.28)}
[data-theme=light]{color-scheme:light;--b0:#E6ECFA;--b1:#F7F9FF;--t:#0F1B3D;--m:#4F5E87;--g:rgba(255,255,255,.62);--gs:#FFFFFF;--gb:rgba(38,86,237,.16);--hl:rgba(255,255,255,.95);--sh:rgba(30,60,140,.17);--p:#1F47D6;--row:rgba(38,86,237,.1);--th:rgba(38,86,237,.07);--wbg:rgba(255,152,0,.16);--wt:#7A4300;--blob1:rgba(38,86,237,.22);--blob2:rgba(147,201,15,.2);--blob3:rgba(48,127,226,.18)}
[hidden]{display:none!important}*{box-sizing:border-box}html{background:var(--b0)}
body{margin:0;font:15px/1.5 var(--bf);color:var(--t);min-height:100vh;background:linear-gradient(160deg,var(--b0),var(--b1));background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 50% at 10% 6%,var(--blob1),transparent 70%),radial-gradient(45% 40% at 94% 94%,var(--blob2),transparent 70%),radial-gradient(40% 35% at 88% 8%,var(--blob3),transparent 70%)}
.glass{position:relative;background:var(--g);border:1px solid var(--gb);border-radius:18px;box-shadow:inset 0 1px 0 var(--hl),0 10px 34px var(--sh);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,0) 38%)}
[data-glass=off] .glass{background:var(--gs);-webkit-backdrop-filter:none;backdrop-filter:none}[data-glass=off] .glass::before{display:none}
@supports not (backdrop-filter:blur(1px)){.glass{background:var(--gs)}}
h1,h2,h3,.hf{font-family:var(--hf)}h2{font-size:22px;line-height:1.2;margin:0;font-weight:700}h3{font-size:15px;margin:20px 0 8px;font-weight:700;color:var(--p)}
.m{color:var(--m);font-size:13px;margin:4px 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;padding:16px;min-height:100vh;max-width:1500px;margin:0 auto}
.side{position:sticky;top:16px;height:calc(100vh - 32px);display:flex;flex-direction:column;padding:18px 12px}
.brand{padding:4px 8px 18px}.brand img{display:block;width:100%;max-width:170px;height:auto}
[data-theme=dark] #lgL,[data-theme=light] #lgD{display:none}
nav{display:flex;flex-direction:column;gap:4px}
.nv,.tg{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:1px solid transparent;border-radius:12px;background:none;color:var(--t);font:500 14.5px var(--bf);text-align:left;cursor:pointer}
.nv:hover,.tg:hover{background:var(--row)}.nv[aria-current=page]{background:color-mix(in srgb,var(--pb) 24%,transparent);border-color:color-mix(in srgb,var(--pb) 45%,transparent);box-shadow:inset 0 1px 0 var(--hl)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}
button:focus-visible,.nv:focus-visible,summary:focus-visible,input:focus-visible+span{outline:2px solid var(--p);outline-offset:2px}
.view{display:grid;gap:16px;align-content:start}#v-enviar{grid-template-columns:minmax(280px,370px) minmax(0,1fr)}
.pn{padding:20px}.pn>h2{margin-bottom:14px}
.ban{padding:14px 20px;font-size:14.5px;display:flex;gap:10px;align-items:center}.ban .ic{color:var(--ok)}
#drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;min-height:190px;padding:20px;border:1.5px dashed color-mix(in srgb,var(--p) 60%,transparent);border-radius:14px;background:color-mix(in srgb,var(--pb) 10%,transparent);color:var(--t);font:600 16px var(--hf);cursor:pointer}
#drop .ic{width:42px;height:42px;color:var(--p)}#drop small{font:400 13px var(--bf);color:var(--m)}#drop:hover,#drop.on{background:color-mix(in srgb,var(--pb) 20%,transparent);border-color:var(--p)}
.prog{height:5px;border-radius:9px;background:var(--row);margin:14px 0 4px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--pb);border-radius:9px;transition:width .3s}
.qh{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 6px}.qh b{font:700 15px var(--hf)}
.q{list-style:none;margin:0;padding:0}.q li+li{border-top:1px solid var(--row)}
.qi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 6px;background:none;border:0;border-radius:8px;color:var(--t);font:14px var(--bf);text-align:left;cursor:pointer}.qi:hover{background:var(--row)}.qi[aria-current=true]{background:color-mix(in srgb,var(--pb) 18%,transparent)}
.qi span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qi .ic{width:18px;height:18px}.ok{color:var(--ok)}.er{color:var(--warn)}
.spin{width:14px;height:14px;margin:2px;border:2px solid var(--row);border-top-color:var(--p);border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;border:1px solid color-mix(in srgb,#fff 28%,var(--pb));background:var(--pb);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);color:#fff;font:600 14.5px var(--bf);cursor:pointer}
.btn:hover{filter:brightness(1.1)}.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}.btn.s{background:var(--row);color:var(--t);border-color:var(--gb);box-shadow:none}.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.top .btn{flex:none}
.tw{overflow-x:auto;border-radius:12px}table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--row);vertical-align:top}th{background:var(--th);font-weight:600;white-space:nowrap}
td:first-child{font-variant-numeric:tabular-nums;white-space:nowrap}.n{text-align:right;font-variant-numeric:tabular-nums}.tt td{font-weight:700;border-bottom:0}td.m{color:var(--m);font-size:12.5px}
.w{margin:16px 0 0;padding:12px 16px;border-radius:12px;background:var(--wbg);border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);color:var(--t)}
.w summary{cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center;list-style:none}.w summary .ic{color:var(--warn)}.w ul{margin:8px 0 0;padding-left:20px;font-size:13px;color:var(--wt);max-height:190px;overflow:auto}.w li+li{margin-top:3px}
details.bl{margin-top:16px}details.bl summary{cursor:pointer;color:var(--m);font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.tile{padding:16px 18px}.tile b{display:block;font:700 30px/1.1 var(--hf)}.tile span{color:var(--m);font-size:13px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--ok) 25%,transparent)}.pill.w2{background:var(--wbg);color:var(--wt)}
.lk{background:none;border:0;padding:0;color:var(--p);font:600 13.5px var(--bf);cursor:pointer;text-decoration:underline}
.pr{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--row)}.pr:last-of-type{border:0}.pr small{display:block;color:var(--m);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--gb);border-radius:11px;overflow:hidden}.seg button{background:none;border:0;padding:7px 14px;color:var(--t);font:500 13.5px var(--bf);cursor:pointer}.seg button[aria-pressed=true]{background:var(--pb);color:#fff}
.sw{position:relative;display:inline-block;width:46px;height:26px}.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}.sw span{position:absolute;inset:0;border-radius:99px;background:var(--row);border:1px solid var(--gb);transition:background .2s}.sw span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}.sw input:checked+span{background:var(--pb)}.sw input:checked+span::after{transform:translateX(20px)}
.empty{padding:34px 12px;text-align:center;color:var(--m)}
@media(max-width:1100px){#v-enviar{grid-template-columns:1fr}}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:10px}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:10px}.brand{padding:0 6px}.brand img{max-width:110px}nav{flex-direction:row;flex-wrap:wrap}.nv span,.tg span{display:none}.nv,.tg{width:auto;padding:10px}.sp{display:none}.ex{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}.prog i,.sw span,.sw span::after{transition:none}}
</style></head><body>

 H=H.filter(x=>!(x.r.meta.orfa===r.meta.orfa&&x.r.file===r.file));H.unshift(e);H=H.slice(0,30);
 while(H.length&&!LS.set('orfa_hist',H))H.pop();}
async function load(files){
 files=Array.from(files).filter(f=>/\.pdf$/i.test(f.name));if(!files.length)return;
 view='enviar';const first=Q.length;files.forEach(f=>Q.push({name:f.name,st:'run'}));prog=0;render();
 for(let i=0;i<files.length;i++){const q=Q[first+i];$('live').textContent=`Lendo ${i+1} de ${files.length}…`;
  try{const r=await readPdf(files[i]);let k=S.findIndex(x=>x.meta.orfa===r.meta.orfa);if(k>=0)S[k]=r;else k=S.push(r)-1;q.st='ok';q.k=r.meta.orfa;sel=k;remember(r);}
  catch(e){q.st='err';q.msg=e.message;}
  prog=100*(i+1)/files.length;render();}
 $('live').textContent=`${files.length} arquivo(s) processado(s).`;
}
const sum=(s,t)=>agg(s.items).filter(x=>x.tipo===t).reduce((a,b)=>a+b.qtd,0),nExp=s=>s.blocks.reduce((a,b)=>a+b.qty,0);
const dt=t=>new Date(t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const ic=(n,c='')=>`<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const tbl=(rows,tipo)=>{const r=rows.filter(x=>x.tipo===tipo);if(!r.length)return`<p class="m">Nenhum item de ${tipo.toLowerCase()}.</p>`;
 return`<div class="tw"><table><tr><th>Código<th>Descrição<th class="n">Qtd<th>Origem</tr>${r.map(x=>`<tr><td>${esc(x.code)}<td>${esc(x.desc)}<td class="n">${x.qtd}<td class="m">${esc(x.refs.join('; '))}</tr>`).join('')}<tr class="tt"><td><td>Total<td class="n">${r.reduce((a,b)=>a+b.qtd,0)}<td></tr></table></div>`;};
const exBtns=()=>`<div class="ex"><button class="btn" onclick="toXlsx()">${ic('xl')}Exportar para Excel (XLSX)</button><button class="btn" onclick="toPdf()">${ic('pdf')}Exportar para PDF (formatado)</button></div><p class="m">A exportação inclui as ${S.length} ORFA(s) da fila.</p>`;
function qList(){
 if(!Q.length)return'<p class="m">Nenhum arquivo na fila.</p>';
 const cur=Q.map((q,i)=>{const k=S.findIndex(x=>x.meta.orfa===q.k),on=view==='enviar'&&sel===k&&q.st==='ok';
  const icon=q.st==='run'?'<i class="spin"></i>':q.st==='ok'?ic('ok','ok'):ic('al','er');
  return`<li><button class="qi" ${q.st==='ok'?`onclick="pick(${k})" aria-current="${on}"`:'disabled'} title="${esc(q.msg||q.name)}">${icon}<span>${esc(q.k?'ORFA '+q.k+' · ':'')}${esc(q.name)}</span></button></li>`;}).join('');
 return`<div class="qh"><b>Arquivos na fila</b>${S.length>1?`<button class="lk" onclick="pick('all')">Ver levantamento geral</button>`:''}</div><ul class="q">${cur}</ul>`;}
function detail(){
 if(!S.length)return`<section class="pn glass empty">Nenhuma ORFA lida ainda.<br>Arraste os PDFs ao lado para ver os vidros e evaporadores.</section>`;
 if(sel==='all'){const all=agg(S.flatMap(s=>s.items));return`<article class="pn glass"><h2>Levantamento geral</h2><p class="m">${S.length} ORFAs somadas</p><h3>Evaporadores</h3>${tbl(all,'Evaporador')}<h3>Vidros</h3>${tbl(all,'Vidro')}${exBtns()}</article>`;}
 const s=S[sel]||S[0],i=S.indexOf(s),a=agg(s.items),m=s.meta;
 return`<article class="pn glass"><div class="top"><div><h2>ORFA ${esc(m.orfa)}</h2><p class="m">${esc(m.cliente)}${m.cidade?' • '+esc(m.cidade):''}${m.entrega?' • entrega '+esc(m.entrega):''}</p><p class="m">${s.blocks.length} bloco(s) de expositor • ${nExp(s)} expositor(es) • ${esc(s.file)}</p></div><button class="btn s sm" onclick="rem(${i})">Remover</button></div>
 ${s.warns.length?`<details class="w" open><summary>${ic('al')}${s.warns.length} aviso(s) para conferir</summary><ul>${s.warns.map(w=>`<li>${esc(w)}`).join('')}</ul></details>`:''}
 <h3>Evaporadores</h3>${tbl(a,'Evaporador')}<h3>Vidros</h3>${tbl(a,'Vidro')}
 <details class="bl"><summary>Blocos lidos do PDF (${s.blocks.length})</summary><div class="tw"><table><tr><th class="n">Qtd<th>Modelo<th class="n">Comp.<th>Endereço<th>Fluido/Gás<th>Evaporador<th>Serigrafia<th>Lat. dir.<th>Lat. esq.</tr>${s.blocks.map(b=>`<tr><td class="n">${b.qty}<td>${esc(b.model)}<td class="n">${b.len}<td>${esc(b.addr)}<td>${esc(b.f['Fluido/Gas']||'')}<td>${esc(b.f['Evaporador']||'')}<td>${esc(b.f['Serigrafia']||'')}<td>${esc(b.latD)}<td>${esc(b.latE)}</tr>`).join('')}</table></div></details>
 ${exBtns()}</article>`;}
function painel(){
 if(!S.length)return`<section class="pn glass empty">Nada para mostrar ainda.<br><button class="lk" onclick="go('enviar')">Enviar PDFs</button></section>`;
 const T=f=>S.reduce((a,s)=>a+f(s),0),all=agg(S.flatMap(s=>s.items));
 const tile=(n,l)=>`<div class="tile glass"><b>${n}</b><span>${l}</span></div>`;
 return`<div class="tiles">${tile(S.length,'ORFAs lidas')}${tile(T(nExp),'Expositores')}${tile(T(s=>sum(s,'Evaporador')),'Evaporadores')}${tile(T(s=>sum(s,'Vidro')),'Vidros')}${tile(T(s=>s.warns.length),'Avisos para conferir')}</div>
 <section class="pn glass"><h2>ORFAs processadas</h2><div class="tw"><table><tr><th>ORFA<th>Cliente<th>Entrega<th class="n">Expositores<th class="n">Evaporadores<th class="n">Vidros<th>Situação</tr>${S.map((s,i)=>`<tr><td><button class="lk" onclick="pick(${i})">${esc(s.meta.orfa)}</button><td>${esc(s.meta.cliente)}<td>${esc(s.meta.entrega)}<td class="n">${nExp(s)}<td class="n">${sum(s,'Evaporador')}<td class="n">${sum(s,'Vidro')}<td>${s.warns.length?`<span class="pill w2">${s.warns.length} aviso(s)</span>`:'<span class="pill">Ok</span>'}</tr>`).join('')}</table></div></section>
 <section class="pn glass"><h2>Levantamento geral</h2><h3>Evaporadores</h3>${tbl(all,'Evaporador')}<h3>Vidros</h3>${tbl(all,'Vidro')}${exBtns()}</section>`;}
function hist(){
 if(!H.length)return`<section class="pn glass empty">O histórico está vazio.<br>As ORFAs que você ler ficam salvas aqui, neste navegador.</section>`;
 return`<section class="pn glass"><div class="top"><div><h2>Histórico</h2><p class="m">Últimas ${H.length} ORFA(s) lidas neste navegador. O resultado salvo é o da data em que o PDF foi lido.</p></div><button class="btn s sm" onclick="H=[];LS.set('orfa_hist',H);render()">Limpar histórico</button></div>
 <div class="tw"><table><tr><th>Lida em<th>ORFA<th>Cliente<th class="n">Evaporadores<th class="n">Vidros<th>Avisos<th></tr>${H.map((e,i)=>`<tr><td>${dt(e.t)}<td>${esc(e.r.meta.orfa)}<td>${esc(e.r.meta.cliente)}<td class="n">${sum(e.r,'Evaporador')}<td class="n">${sum(e.r,'Vidro')}<td>${e.r.warns.length}<td><button class="btn s sm" onclick="openH(${i})">Abrir</button></tr>`).join('')}</table></div></section>`;}
function pref(){
 const seg=(v,l)=>`<button aria-pressed="${P.theme===v}" onclick="setP('theme','${v}')">${l}</button>`,sw=(k,on)=>`<label class="sw"><input type="checkbox" ${on?'checked':''} onchange="setP('${k}',this.checked)" aria-label="${k}"><span></span></label>`;
 return`<section class="pn glass"><h2>Preferências</h2>
 <div class="pr"><div>Tema<small>Automático segue o tema do seu sistema.</small></div><div class="seg">${seg('auto','Automático')}${seg('light','Claro')}${seg('dark','Escuro')}</div></div>
 <div class="pr"><div>Efeito de vidro<small>Desligue se o site ficar lento ou se preferir fundos sólidos.</small></div>${sw('glass',P.glass)}</div>
 <div class="pr"><div>Guardar histórico neste navegador<small>Salva as ORFAs lidas para você reabrir depois. Nada sai do seu computador.</small></div>${sw('hist',P.hist)}</div></section>`;}
function setP(k,v){P[k]=v;applyPref();render();}
function pick(i){sel=i;view='enviar';render();}
function go(v){view=v;render();}
function rem(i){const o=S[i].meta.orfa;S.splice(i,1);for(let k=Q.length-1;k>=0;k--)if(Q[k].k===o)Q.splice(k,1);sel=Math.max(0,Math.min(sel,S.length-1));render();}
function openH(i){const r=JSON.parse(JSON.stringify(H[i].r));let k=S.findIndex(x=>x.meta.orfa===r.meta.orfa);if(k>=0)S[k]=r;else k=S.push(r)-1;if(!Q.some(q=>q.k===r.meta.orfa))Q.push({name:r.file,st:'ok',k:r.meta.orfa});sel=k;view='enviar';render();}
function render(){
 document.querySelectorAll('.nv').forEach(b=>b.setAttribute('aria-current',b.dataset.v===view?'page':'false'));
 ['enviar','painel','hist','pref'].forEach(v=>{$('v-'+v).hidden=v!==view;});
 if(view==='enviar'){$('queue').innerHTML=qList();$('detail').innerHTML=detail();$('bar').style.width=prog+'%';}
 else $('v-'+view).innerHTML={painel,hist,pref}[view]();
}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5e3);}
async function toXlsx(){
 const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Planilha1');ws.columns=[{width:48},{width:11},{width:12},{width:64},{width:8}];
 const hd=r=>{r.font={bold:true,color:{argb:'FFFFFFFF'}};r.eachCell(c=>c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1F4E78'}});};
 const block=(s,tipo,titulo)=>{const rows=agg(s.items).filter(x=>x.tipo===tipo);if(!rows.length)return;
  const t=ws.addRow([titulo]);ws.mergeCells(t.number,1,t.number,5);t.font={bold:true};t.alignment={horizontal:'center'};
  hd(ws.addRow(['ORDEM DE PRODUÇÃO','N OF','CODIGO','DESC','QTD']));
  rows.forEach(x=>ws.addRow([s.meta.cliente,s.meta.orfa,x.code,x.desc,x.qtd]));};
 S.forEach(s=>{block(s,'Evaporador','PROGRAMAÇÃO DE MATERIAIS - EVAPORADORES');block(s,'Vidro','PROGRAMAÇÃO DE MATERIAIS - VIDROS');});
 const last=ws.rowCount,g=wb.addWorksheet('TOTAL GERAL'),all=agg(S.flatMap(s=>s.items));g.columns=[{width:12},{width:72},{width:10}];
 [['Evaporador','TOTAL DE EVAPORADORES'],['Vidro','TOTAL DE VIDROS']].forEach(([tp,lb])=>{
  const rows=all.filter(x=>x.tipo===tp);if(!rows.length)return;hd(g.addRow(['CODIGO','DESC','QTD']));const a=g.rowCount+1;
  rows.forEach(x=>{const n=g.addRow([x.code,x.desc]).number;g.getCell(n,3).value={formula:`SUMIF(Planilha1!$C$1:$C$${last},A${n},Planilha1!$E$1:$E$${last})`,result:x.qtd};});
  const t=g.addRow(['',lb,{formula:`SUM(C${a}:C${g.rowCount})`,result:rows.reduce((p,c)=>p+c.qtd,0)}]);t.font={bold:true};g.addRow([]);});
 const av=wb.addWorksheet('AVISOS');av.columns=[{width:12},{width:130}];hd(av.addRow(['N OF','AVISO']));S.forEach(s=>s.warns.forEach(w=>av.addRow([s.meta.orfa,w])));
 save(new Blob([await wb.xlsx.writeBuffer()],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'levantamento_orfa.xlsx');
}
function toPdf(){
 const doc=new jspdf.jsPDF(),mk=(title,sub,rows)=>{
  try{doc.addImage($('lgL').src,'PNG',14,8,36,6.17);}catch(e){}doc.setFontSize(14);doc.text(title,14,25);doc.setFontSize(9);doc.text(doc.splitTextToSize(sub||'',180),14,31);let y=sub?38:32;
  [['Evaporador','Evaporadores'],['Vidro','Vidros']].forEach(([t,l])=>{const r=rows.filter(x=>x.tipo===t);doc.setFontSize(11);doc.text(l,14,y+4);
   doc.autoTable({startY:y+7,head:[['Código','Descrição','Qtd']],body:r.length?r.map(x=>[x.code,x.desc,x.qtd]):[['','Nenhum item','']],styles:{fontSize:8},headStyles:{fillColor:[31,78,120]},columnStyles:{2:{halign:'right',cellWidth:16}},margin:{left:14,right:14}});y=doc.lastAutoTable.finalY+8;});};
 S.forEach((s,i)=>{if(i)doc.addPage();mk('ORFA '+s.meta.orfa,`${s.meta.cliente}${s.meta.cidade?' — '+s.meta.cidade:''}${s.meta.entrega?' — entrega '+s.meta.entrega:''}`,agg(s.items));});
 if(S.length>1){doc.addPage();mk('Levantamento geral','ORFAs: '+S.map(s=>s.meta.orfa).join(', '),agg(S.flatMap(s=>s.items)));}
 save(doc.output('blob'),'levantamento_orfa.pdf');
}

const dz=$('drop');
dz.addEventListener('click',()=>$('file').click());
['dragover','dragenter'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.add('on');}));
['dragleave','drop'].forEach(e=>dz.addEventListener(e,()=>dz.classList.remove('on')));
dz.addEventListener('drop',ev=>{ev.preventDefault();load(ev.dataTransfer.files);});
$('file').addEventListener('change',e=>{const f=Array.from(e.target.files);e.target.value='';load(f);});
document.querySelectorAll('.nv').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));
$('tg').addEventListener('click',()=>{P.theme=dark()?'light':'dark';applyPref();if(view==='pref')render();});
applyPref();render();
</script></body></html>
